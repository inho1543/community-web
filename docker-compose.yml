services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - community_data:/data
    networks:
      - internal
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - internal
networks:
  internal:
volumes:
  community_data:
